spring:
  application:
    name: medcore-api
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medcore}
    username: ${DB_USERNAME:medcore}
    password: ${DB_PASSWORD:medcore}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      pool-name: medcore-pool

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # schema is owned by Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

  cache:
    type: redis
    redis:
      time-to-live: 10m
      key-prefix: "medcore:cache:"

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: medcore-api
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    persist-authorization: true
  default-produces-media-type: application/json
  paths-to-match: /api/**

medcore:
  security:
    jwt:
      # Base64-encoded HMAC-SHA key (>= 256 bits). Override in every non-local environment.
      secret: ${JWT_SECRET:bWVkY29yZS1sb2NhbC1kZXZlbG9wbWVudC1zZWNyZXQta2V5LWNoYW5nZS1tZQ==}
      issuer: medcore-api
      access-token-ttl: 15m
      refresh-token-ttl: 7d
    password-reset-ttl: 30m
    email-verification-ttl: 24h
    two-factor-code-ttl: 5m
  rate-limit:
    enabled: true
    requests-per-minute: ${RATE_LIMIT_RPM:120}
    auth-requests-per-minute: ${RATE_LIMIT_AUTH_RPM:10}
  stripe:
    api-key: ${STRIPE_API_KEY:sk_test_replace_me}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_replace_me}
    default-currency: eur
  storage:
    local-root: ${STORAGE_ROOT:./storage}
  mail:
    from: ${MAIL_FROM:no-reply@medcore.health}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  appointments:
    reminder-lead-time: 24h
    reminder-cron: "0 */15 * * * *"
    cancellation-min-notice: 2h
  kafka:
    retry-attempts: 3
    retry-backoff: 2s

logging:
  level:
    root: INFO
    com.medcore: DEBUG
    org.hibernate.SQL: WARN
